<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Without this line, phones shrink the page as if it were a desktop site. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kleiderschrank{% endblock %}</title>
  <!-- 98.css provides the Windows 98 look; app.css only adds our own layout. -->
  <link rel="stylesheet" href="/static/vendor/98.css">
  <link rel="stylesheet" href="/static/app.css">
  <!-- htmx reads the hx-* attributes in the HTML and sends the requests. -->
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  {# Every page fills this block with its own window. #}
  {% block content %}{% endblock %}
</body>
</html>
