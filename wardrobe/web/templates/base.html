<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Without this line, phones shrink the page as if it were a desktop site.
       viewport-fit=cover lets the CSS ask for the safe area at the bottom of an iPhone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Colours the browser bar on the phone like the page background. -->
  <meta name="theme-color" content="#f6f4ef">
  <title>{% block title %}Kleiderschrank{% endblock %}</title>
  <!-- app.css holds the whole look of the app. -->
  <link rel="stylesheet" href="/static/app.css">
  <!-- htmx reads the hx-* attributes in the HTML and sends the requests. -->
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  {# Every page fills this block with its own content. #}
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
