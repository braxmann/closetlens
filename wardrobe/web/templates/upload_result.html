{# Answer to an upload: the new icon, plus an updated garment count.
   hx-swap-oob ("out of band") tells htmx to swap that element by its id, outside the normal target. #}
{% include "_icon.html" %}
<p class="meta" id="count" hx-swap-oob="true">{{ total }} {{ "Teil" if total == 1 else "Teile" }}</p>
